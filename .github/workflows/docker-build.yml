# 构建多架构镜像（amd64 / arm64）并推送到 GitHub Container Registry（ghcr.io）
# 推送到 main 分支或手动运行时触发，使用本仓库源码构建，无需额外配置密钥。
#
# 可选：如需同时推送到 Docker Hub，在仓库 Settings → Secrets and variables → Actions 中配置
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN（镜像名为 <DOCKERHUB_USERNAME>/dnsmgr）

name: Docker Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-checks:
    uses: ./.github/workflows/checks.yml
  build-and-push:
    name: Build and smoke (${{ matrix.arch }})
    needs: regression-checks
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image names
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          tags="ghcr.io/${owner}/dnsmgr:sha-${GITHUB_SHA::7}-${{ matrix.arch }}"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            tags="${tags},${DOCKERHUB_USERNAME}/dnsmgr:sha-${GITHUB_SHA::7}-${{ matrix.arch }}"
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.meta.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build native image for runtime checks
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          provenance: false
          sbom: false
          tags: dnsmgr-smoke:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.title=dnsmgr
            org.opencontainers.image.description=彩虹聚合DNS管理系统（含开放API）
          cache-from: |
            type=gha,scope=dnsmgr-${{ matrix.arch }}
            type=gha
          cache-to: type=gha,scope=dnsmgr-${{ matrix.arch }},mode=max

      - name: Check container startup and installer
        env:
          IMAGE_TAG: dnsmgr-smoke:${{ github.sha }}
        run: |
          test "$(docker inspect --format '{{.Architecture}}' "$IMAGE_TAG")" = '${{ matrix.arch }}'
          docker run --detach --name dnsmgr-smoke --publish 127.0.0.1:18081:80 "$IMAGE_TAG"
          docker exec dnsmgr-smoke nginx -t
          docker exec -i dnsmgr-smoke php < .github/docker/verify-runtime.php
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' dnsmgr-smoke)" = healthy ]; then
              break
            fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' dnsmgr-smoke)" = healthy
          # Verify the web SAPI too; the probe exists only in this disposable container.
          probe="dnsmgr-runtime-${GITHUB_RUN_ID}.php"
          trap 'docker exec dnsmgr-smoke rm -f "/app/www/public/$probe"' EXIT
          docker cp .github/docker/verify-runtime.php "dnsmgr-smoke:/app/www/public/$probe"
          curl --fail-with-body --silent --show-error --max-time 20 "http://127.0.0.1:18081/$probe" \
            | tee "$RUNNER_TEMP/dnsmgr-runtime.json"
          jq --exit-status '.php == "8.3.36" and .sapi == "fpm-fcgi" and (.checks | index("application-signature") != null)' "$RUNNER_TEMP/dnsmgr-runtime.json"
          docker exec dnsmgr-smoke rm "/app/www/public/$probe"
          trap - EXIT
          curl --fail --silent --show-error --location --max-time 20 http://127.0.0.1:18081/install > "$RUNNER_TEMP/dnsmgr-install.html"
          test -s "$RUNNER_TEMP/dnsmgr-install.html"
          grep -q '安装' "$RUNNER_TEMP/dnsmgr-install.html"
          for program in php-fpm nginx; do
            before=$(docker exec dnsmgr-smoke supervisorctl -c /etc/supervisor/conf.d/supervisord.conf pid "$program" | tr -d '\r')
            test "$before" -gt 1
            docker exec dnsmgr-smoke kill -KILL "$before"
            recovered=false
            for attempt in $(seq 1 20); do
              after=$(docker exec dnsmgr-smoke supervisorctl -c /etc/supervisor/conf.d/supervisord.conf pid "$program" | tr -d '\r')
              if [ "$after" -gt 1 ] && [ "$after" != "$before" ] && curl --fail --silent --max-time 5 http://127.0.0.1:18081/install > /dev/null; then
                recovered=true
                break
              fi
              sleep 1
            done
            test "$recovered" = true
            sleep 3
            test "$(docker exec dnsmgr-smoke supervisorctl -c /etc/supervisor/conf.d/supervisord.conf pid "$program" | tr -d '\r')" = "$after"
            docker exec dnsmgr-smoke supervisorctl -c /etc/supervisor/conf.d/supervisord.conf status "$program" | grep -q RUNNING
            curl --fail --silent --show-error --max-time 10 http://127.0.0.1:18081/install > /dev/null
          done
          test "$(docker exec dnsmgr-smoke cat /proc/1/comm | tr -d '\r')" = supervisord
          docker stop --time 15 dnsmgr-smoke
          test "$(docker inspect --format '{{.State.ExitCode}}' dnsmgr-smoke)" = 0

      - name: Clean up test container
        if: always()
        run: |
          docker logs dnsmgr-smoke 2>&1 || true
          docker rm --force dnsmgr-smoke 2>/dev/null || true

      - name: Push exact tested image
        env:
          IMAGE_TAG: dnsmgr-smoke:${{ github.sha }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IFS=',' read -ra image_tags <<< "$IMAGE_TAGS"
          for tag in "${image_tags[@]}"; do
            docker tag "$IMAGE_TAG" "$tag"
            docker push "$tag"
          done

  publish:
    name: Publish verified multi-platform image
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check optional Docker Hub destination
        id: hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to Docker Hub
        if: steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish manifests only after both native startup checks pass
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/dnsmgr"
          version="sha-${GITHUB_SHA::7}"
          docker buildx imagetools create --tag "${image}:${version}" --tag "${image}:latest" \
            "${image}:${version}-amd64" "${image}:${version}-arm64"
          docker buildx imagetools inspect "${image}:${version}"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            image="${DOCKERHUB_USERNAME}/dnsmgr"
            docker buildx imagetools create --tag "${image}:${version}" --tag "${image}:latest" \
              "${image}:${version}-amd64" "${image}:${version}-arm64"
            docker buildx imagetools inspect "${image}:${version}"
          fi
