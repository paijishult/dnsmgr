<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="utf-8"/>
  <meta name="renderer" content="webkit">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="robots" content="noindex,nofollow">
  <title>登录 - 聚合CC-DNS</title>
  <link rel="icon" href="/favicon.ico?v=cc1" sizes="any"/>
  <link rel="apple-touch-icon" href="/static/images/apple-touch-icon.png?v=cc1"/>
  <link href="/static/css/bootstrap-3.4.1.min.css" rel="stylesheet"/>
  <link href="/static/css/font-awesome-4.7.0.min.css" rel="stylesheet"/>
  <link href="/static/css/modern.css?v={:config('app.version')}" rel="stylesheet"/>
  <script src="/static/js/jquery-3.7.1.min.js"></script>
<style>
html, body { height: 100%; }
body {
  background: #f5f5f7;
  background-image:
    radial-gradient(38rem 28rem at 12% 12%, rgba(0, 113, 227, .16), transparent 60%),
    radial-gradient(34rem 26rem at 88% 18%, rgba(175, 82, 222, .13), transparent 60%),
    radial-gradient(40rem 30rem at 70% 92%, rgba(48, 176, 199, .14), transparent 60%);
  background-attachment: fixed;
}
.auth { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 40px 18px; }
.auth-card {
  width: 100%; max-width: 400px; padding: 40px 36px 30px; border-radius: 24px;
  background: rgba(255, 255, 255, .86);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 24px 60px rgba(0, 0, 0, .10), 0 0 0 .5px rgba(0, 0, 0, .06);
  animation: auth-in .7s cubic-bezier(.32, .72, 0, 1) both;
}
@supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
  .auth-card { background: rgba(255, 255, 255, .7); -webkit-backdrop-filter: saturate(180%) blur(30px); backdrop-filter: saturate(180%) blur(30px); }
}
@keyframes auth-in { from { opacity: 0; transform: translate3d(0, 16px, 0) scale(.98); } to { opacity: 1; transform: none; } }
.auth-icon {
  width: 76px; height: 76px; margin: 0 auto 18px; border-radius: 20px; padding: 8px; background: #fff;
  box-shadow: 0 10px 26px rgba(30, 220, 194, .22), 0 2px 6px rgba(0, 0, 0, .06);
}
.auth-icon img { display: block; width: 100%; height: 100%; object-fit: contain; }
.auth-card h1 { font-size: 26px; font-weight: 700; text-align: center; margin: 0 0 6px; color: #1d1d1f; letter-spacing: -.02em; }
.auth-card .sub { color: #6e6e73; text-align: center; margin: 0 0 28px; font-size: 14.5px; }
.auth-card .form-group { margin-bottom: 14px; position: relative; }
.auth-card .form-control { height: 48px; font-size: 16px; border-radius: 12px; padding: 0 14px; background: rgba(255, 255, 255, .9); }
.auth-card .code-row { display: flex; gap: 10px; }
.auth-card .code-row img { height: 48px; border-radius: 12px; border: 1px solid #d2d2d7; cursor: pointer; background: #fff; }
.auth-card .btn-primary { height: 48px; font-size: 16px; font-weight: 600; border-radius: 12px; margin-top: 6px; }
.auth-card .links { margin-top: 18px; text-align: center; font-size: 13.5px; }
.auth-card .links a { color: #0071e3; }
.auth-step { animation: step-in .45s cubic-bezier(.32, .72, 0, 1) both; }
@keyframes step-in { from { opacity: 0; transform: translate3d(24px, 0, 0); } to { opacity: 1; transform: none; } }
.auth-tip { background: rgba(0, 113, 227, .08); color: #0058b0; border-radius: 12px; padding: 11px 14px; font-size: 13.5px; margin-bottom: 16px; line-height: 1.6; }
.auth-foot { text-align: center; color: #86868b; font-size: 12px; margin-top: 22px; }
.sr-only-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (max-width: 480px) { .auth-card { padding: 32px 22px 24px; border-radius: 20px; } }
@media (prefers-reduced-motion: reduce) { .auth-card, .auth-step { animation: none; } }
</style>
</head>
<body>
<div class="auth">
  <main class="auth-card">
    <div class="auth-icon" aria-hidden="true"><img src="/static/images/brand.png?v=cc1" alt=""/></div>
    <h1>聚合CC-DNS</h1>
    <p class="sub" id="authSub">登录以管理你的域名、解析与证书</p>
    <form action="" id="login-form" class="auth-step" onsubmit="return doLogin()" autocomplete="on">
      <div class="form-group">
        <label for="username" class="sr-only-label">用户名</label>
        <input type="text" class="form-control" id="username" name="username" placeholder="用户名" autocomplete="username" required="required" autofocus/>
      </div>
      <div class="form-group">
        <label for="password" class="sr-only-label">密码</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="密码" autocomplete="current-password" required="required"/>
      </div>
      {if config_get('vcode', '1')=='1'}<div class="form-group">
        <label for="code" class="sr-only-label">验证码</label>
        <div class="code-row">
          <input type="text" class="form-control" id="code" name="code" placeholder="验证码" autocomplete="off" required="required"/>
          <img id="verifycode" src="/verifycode" onclick="this.src='/verifycode?r='+Math.random();" title="点击更换验证码" alt="验证码">
        </div>
      </div>{/if}
      <button type="submit" class="btn btn-primary btn-block" id="submit">登录</button>
      <div class="links"><a href="javascript:findpwd()">忘记密码？</a></div>
    </form>
    <form action="" id="totp-form" class="auth-step" onsubmit="return doTotp()" style="display:none;">
      <div class="auth-tip"><i class="fa fa-shield"></i> 已开启两步验证，请输入身份验证器中的 6 位动态口令。</div>
      <div class="form-group">
        <label for="totp_code" class="sr-only-label">动态口令</label>
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" class="form-control" name="totp_code" id="totp_code" placeholder="6 位动态口令" autocomplete="one-time-code" required="required" style="letter-spacing:.3em;text-align:center;font-size:20px"/>
      </div>
      <button type="submit" class="btn btn-primary btn-block">验证并登录</button>
      <div class="links"><a href="javascript:findpwd()">忘记密码？</a></div>
    </form>
    <div class="auth-foot">连续输错密码 5 次将暂时锁定登录</div>
  </main>
</div>
<div class="modal" id="modal-findpwd">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
				<h4 class="modal-title">忘记密码</h4>
			</div>
			<div class="modal-body">
				<strong>重置密码</strong>
                <p>进入网站根目录，执行命令：<br/><code>php think reset pwd 用户名 密码</code></p>
                <strong>关闭TOTP</strong>
                <p>进入网站根目录，执行命令：<br/><code>php think reset totp 用户名</code></p>
			</div>
		</div>
	</div>
</div>
<script src="/static/js/bootstrap-3.4.1.min.js"></script>
<script src="/static/js/layer/layer.js"></script>
<script src="/static/js/zn.js?v={:config('app.version')}"></script>
<script>
function doLogin(){
    var username = $("input[name='username']").val();
    var password = $("input[name='password']").val();
    var code = $("input[name='code']").val();
    if(username == ''){
        layer.msg('用户名不能为空', {icon: 2});
        return false;
    }
    if(password == ''){
        layer.msg('密码不能为空', {icon: 2});
        return false;
    }
    if(code == ''){
        layer.msg('验证码不能为空', {icon: 2});
        return false;
    }
    var ii = layer.load(2);
    $.ajax({
        type: "POST",
        url: "/login",
        data: $("#login-form").serialize(),
        dataType: 'json',
        success: function(data){
            layer.close(ii);
            if(data.code == 0){
                layer.msg('登录成功，正在进入控制台', {icon: 1,shade: 0.01,time: 15000});
                window.location.href = '/';
            }else{
                if(data.vcode==1){
                    $("#verifycode").attr('src', '/verifycode?r='+Math.random())
                }else if(data.vcode==2){
                    $("#login-form").hide();
                    $("#totp-form").show();
                    $("#authSub").text('两步验证');
                    $("#totp_code").focus();
                    return false;
                }
                layer.alert(htmlEscape(data.msg), {icon: 2});
            }
        }
    });
    return false;
}
function doTotp(){
    var code = $("#totp_code").val();
    if(code.length != 6){
		layer.msg('动态口令格式错误', {icon: 2});
		return false;
	}
	var ii = layer.load(2, {shade:[0.1,'#fff']});
	$.post('/auth/totp', {code:code}, function(res){
		layer.close(ii);
		if(res.code == 0){
			layer.msg('登录成功，正在进入控制台', {icon: 1,shade: 0.01,time: 15000});
            window.location.href = '/';
		}else{
			layer.alert(htmlEscape(res.msg), {icon: 2});
		}
	});
	return false;
}
function findpwd(){
    $('#modal-findpwd').modal('show');
}
$(document).ready(function(){
	$("#totp_code").keyup(function(){
		var code = $(this).val();
		if(code.length == 6){
			$("#totp-form").submit();
		}
	});
});
</script>
</body>
</html>
